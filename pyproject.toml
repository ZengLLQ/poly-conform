[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poly-conform"
version = "0.1.0"
description = "3D Lattice Monte Carlo Polymer Self-Avoiding Walk and Flory Scaling Engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ZengLLQ", email = "zengllq@users.noreply.github.com"}
]
dependencies = [
    "numpy>=1.22.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]
